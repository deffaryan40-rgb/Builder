name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true

      tag:
        description: "Tag build"
        required: true

      build_type:
        description: "debug / release"
        required: true
        default: "release"

      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

concurrency:
  group: build-flutter-apk-${{ github.event.inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      PUB_ENVIRONMENT: "github_actions"

    steps:

      # =========================
      # DOWNLOAD ZIP
      # =========================
      - name: Download ZIP project
        run: |
          curl -L --compressed -sS \
            --retry 3 --retry-delay 3 --retry-connrefused \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "HTTP Status: %{http_code}\n"
          ls -lh project.zip

      # =========================
      # EXTRACT ZIP
      # =========================
      - name: Extract ZIP
        run: |
          if ! unzip -tq project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid! Isi file:"
            head -c 2000 project.zip
            exit 1
          fi

          unzip -q project.zip -d project_raw

          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          echo "✅ Project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # =========================
      # JAVA 17
      # Sudah terpasang di runner ubuntu-latest, jadi tidak perlu
      # download/setup-java lagi (hemat ~10 detik).
      # =========================
      - name: Use preinstalled Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_17_X64/bin" >> $GITHUB_PATH

      # =========================
      # GRADLE TUNING (global, berlaku juga untuk gradlew di project)
      # =========================
      - name: Tune Gradle
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configureondemand=true
          org.gradle.workers.max=4
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          kotlin.incremental=false
          android.enableJetifier=false
          EOF

      # =========================
      # FLUTTER
      # =========================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics --no-cli-animations

      # =========================
      # CACHE
      # =========================
      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('project_raw/**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('project_raw/**/*.gradle*', 'project_raw/**/gradle-wrapper.properties', 'project_raw/**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ==========================================================
      # ANALYZE
      # ==========================================================
      - name: Analyze Project Code
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "[RESULT_ANALYZE]"
          if [ -f "pubspec.yaml" ]; then
            flutter analyze 2>&1 || true
          else
            echo "❌ Fitur analyze hanya support project Flutter (pubspec.yaml tidak ditemukan)."
          fi
          echo "[END_RESULT_ANALYZE]"

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "Analyze-only mode aktif. Workflow dihentikan di sini."
          exit 1

      # ==========================================================
      # PUB GET
      # ==========================================================
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            for i in 1 2 3; do
              timeout 120s flutter pub get && exit 0
              echo "⚠️ pub get gagal (percobaan $i/3), ulangi..."
              sleep 3
            done
            echo "❌ flutter pub get gagal 3x"
            exit 1
          else
            echo "☕ Bukan project Flutter standar, skip pub get."
          fi

      # ==========================================================
      # BUILD APK
      # arm (32-bit) + arm64 (64-bit) -> semua HP ARM didukung.
      # --split-per-abi -> 2 APK kecil, tiap HP pakai yang cocok.
      # ==========================================================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          BUILD_FAILED=0

          if [ -f "pubspec.yaml" ]; then
            echo "🔥 Flutter project, mode: $BUILD_TYPE"

            EXTRA_FLAGS=""
            if [ "$BUILD_TYPE" = "release" ]; then
              EXTRA_FLAGS="--obfuscate --split-debug-info=build/symbols"
            fi

            if ! flutter build apk --$BUILD_TYPE \
              --no-pub \
              --no-tree-shake-icons \
              --split-per-abi \
              --target-platform android-arm,android-arm64 \
              --no-shrink \
              $EXTRA_FLAGS 2>&1 | tee build_report.txt; then
              BUILD_FAILED=1
            fi

          else
            echo "☕ Project Native Android, mode: $BUILD_TYPE"
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)

            if [ -z "$GRADLE_PATH" ]; then
              echo "[RESULT_BUILD_ERROR]"
              echo "File gradlew tidak ditemukan. Pastikan ini project Android/Flutter yang valid."
              echo "[END_RESULT_BUILD_ERROR]"
              exit 1
            fi

            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew

            if [ "$BUILD_TYPE" = "debug" ]; then
              GRADLE_TASK="assembleDebug"
            else
              GRADLE_TASK="assembleRelease"
            fi

            if ! ./gradlew "$GRADLE_TASK" --parallel --build-cache 2>&1 | tee build_report.txt; then
              BUILD_FAILED=1
            fi

            mv build_report.txt "$OLDPWD/build_report.txt" 2>/dev/null || true
            cd -
          fi

          if [ "$BUILD_FAILED" -eq 1 ]; then
            echo ""
            echo "❌ BUILD GAGAL! Ringkasan error:"
            echo "[RESULT_BUILD_ERROR]"
            if grep -Ei "error|exception|failure|failed" build_report.txt > /dev/null 2>&1; then
              grep -Ei -B2 -A5 "error|exception|failure|failed" build_report.txt
            else
              tail -n 80 build_report.txt
            fi
            echo "[END_RESULT_BUILD_ERROR]"
            exit 1
          fi

          echo "✅ Build APK selesai tanpa error."

      # ==========================================================
      # CHECK APK
      # ==========================================================
      - name: Check APK Output
        run: |
          APK_DIR=""
          FLUTTER_OUT="${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk"

          if [ -d "$FLUTTER_OUT" ] && [ -n "$(find "$FLUTTER_OUT" -maxdepth 1 -name '*.apk' 2>/dev/null)" ]; then
            APK_DIR="$FLUTTER_OUT"
          fi

          if [ -z "$APK_DIR" ]; then
            GRADLE_APK=$(find "${{ env.PROJECT_DIR }}" -path "*/build/outputs/apk/*" -name "*.apk" 2>/dev/null | head -n 1)
            [ -n "$GRADLE_APK" ] && APK_DIR=$(dirname "$GRADLE_APK")
          fi

          if [ -z "$APK_DIR" ]; then
            FALLBACK_APK=$(find "$GITHUB_WORKSPACE" -name "*.apk" 2>/dev/null | head -n 1)
            [ -n "$FALLBACK_APK" ] && APK_DIR=$(dirname "$FALLBACK_APK")
          fi

          if [ -z "$APK_DIR" ]; then
            echo "Error: APK tidak ditemukan sama sekali."
            exit 1
          fi

          echo "APK_DIR=$APK_DIR" >> $GITHUB_ENV
          echo "✅ APK di: $APK_DIR"
          ls -lh "$APK_DIR"/*.apk

      # =========================
      # UPLOAD APK
      # =========================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_DIR }}/*.apk
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
