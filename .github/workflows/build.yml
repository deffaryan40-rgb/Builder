name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
        type: string
      tag:
        description: "Tag build"
        required: true
        type: string
      build_type:
        description: "debug / release"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      only_analyze:
        description: "Hanya analyze (true/false)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=true
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.configureondemand=true
        -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

    steps:
      # ==========================================================
      # 1. DOWNLOAD ZIP
      # ==========================================================
      - name: "01 • Download project"
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail

          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║                 DOWNLOAD PROJECT                          ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          curl --fail --location --retry 4 --retry-delay 2 \
            --connect-timeout 15 --max-time 180 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "$ZIP_URL" -o project.zip

          test -s project.zip
          unzip -t project.zip >/dev/null

          echo "STATUS : OK"
          echo "SIZE   : $(du -h project.zip | cut -f1)"

      # ==========================================================
      # 2. EXTRACT + ROOT DETECTION
      # ==========================================================
      - name: "02 • Prepare Flutter project"
        run: |
          set -euo pipefail

          rm -rf project_raw
          mkdir -p project_raw
          unzip -q project.zip -d project_raw

          SUB_DIR_COUNT=$(find project_raw -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -mindepth 1 -maxdepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -mindepth 1 -maxdepth 1 -type d | head -n1)
          else
            PROJECT_DIR="project_raw"
          fi

          if [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "❌ ERROR: pubspec.yaml tidak ditemukan."
            echo "Kandidat:"
            find project_raw -name pubspec.yaml -print | head -20
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "STATUS : OK"
          echo "ROOT   : $PROJECT_DIR"

      # ==========================================================
      # 3. NODE — hanya bila project memang membutuhkannya
      # ==========================================================
      - name: "03 • Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
        continue-on-error: true

      # ==========================================================
      # 4. JAVA
      # ==========================================================
      - name: "04 • Setup Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ==========================================================
      # 5. FLUTTER
      # ==========================================================
      - name: "05 • Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      # ==========================================================
      # 6. EXTRA CACHE
      # ==========================================================
      - name: "06 • Restore Pub + Gradle cache"
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-flutter-
            ${{ runner.os }}-

      # ==========================================================
      # 7. DEPENDENCIES
      # ==========================================================
      - name: "07 • Get dependencies"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║                 DEPENDENCIES                              ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          SUCCESS=0

          for attempt in 1 2 3; do
            echo "Attempt $attempt/3..."

            if flutter pub get; then
              SUCCESS=1
              break
            fi

            sleep 3
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo
            echo "❌ ERROR: flutter pub get gagal."
            echo "Periksa:"
            echo "  • pubspec.yaml"
            echo "  • versi package"
            echo "  • koneksi pub.dev"
            exit 1
          fi

          echo "STATUS : OK"

      # ==========================================================
      # 8. ANALYZE
      # ==========================================================
      - name: "08 • Analyze"
        id: analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║                 FLUTTER ANALYZE                           ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          STATUS=${PIPESTATUS[0]}

          echo
          echo "════════ ANALYZE RESULT ════════"

          if [ "$STATUS" -ne 0 ]; then
            echo "❌ ANALYZE FAILED"
            echo
            echo "Lokasi/error:"
            grep -E -i \
              -B2 -A5 \
              "^[[:space:]]*(lib/|android/|ios/)|error •|error:|exception:|warning •" \
              analyze.log | tail -n 180 || true
          else
            echo "✅ ANALYZE PASSED"
          fi

          if [ "${{ github.event.inputs.only_analyze }}" = "true" ]; then
            exit "$STATUS"
          fi

          # Analyze hanya memberi diagnosa.
          # Compiler build tetap menjadi pemeriksaan final.
          exit 0

      # ==========================================================
      # 9. BUILD — no-pub supaya tidak resolve dependency ulang
      # ==========================================================
      - name: "09 • Build APK"
        id: build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          BUILD_TYPE="${{ github.event.inputs.build_type }}"

          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║                    BUILD APK                              ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo "MODE : $BUILD_TYPE"
          echo "CACHE: Gradle + Pub"
          echo "PUB  : no-pub"
          echo

          START=$(date +%s)

          if flutter build apk --"$BUILD_TYPE" --no-pub 2>&1 | tee build.log; then
            END=$(date +%s)
            echo
            echo "✅ BUILD SUCCESS"
            echo "⏱️ Build time: $((END-START)) seconds"
          else
            echo
            echo "❌ BUILD FAILED"
            echo
            echo "════════ ERROR DETAIL ════════"

            grep -E -i \
              -B3 -A8 \
              "^[[:space:]]*(lib/|android/|ios/)|error:|error •|exception:|FAILURE:|Execution failed|failed" \
              build.log | tail -n 220 || true

            echo
            echo "════════ LAST LOG ════════"
            tail -n 80 build.log

            exit 1
          fi

      # ==========================================================
      # 10. FIND APK — langsung, tanpa scan seluruh workspace
      # ==========================================================
      - name: "10 • Locate APK"
        id: apk
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=== APK OUTPUT ==="

          APK_FOUND=""

          # Prioritas output Flutter standar.
          for f in \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-debug.apk
          do
            if [ -f "$f" ]; then
              APK_FOUND="$f"
              break
            fi
          done

          # Fallback terbatas.
          if [ -z "$APK_FOUND" ]; then
            APK_FOUND=$(find build/app/outputs -type f -name "*.apk" -print -quit 2>/dev/null || true)
          fi

          if [ -z "$APK_FOUND" ]; then
            echo "❌ APK tidak ditemukan."
            find build/app/outputs -maxdepth 6 -type f 2>/dev/null | head -100 || true
            exit 1
          fi

          APK_NAME=$(basename "$APK_FOUND")
          APK_SIZE=$(du -h "$APK_FOUND" | cut -f1)

          echo "APK_PATH=$APK_FOUND" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

          echo "✅ APK      : $APK_NAME"
          echo "📦 SIZE     : $APK_SIZE"
          echo "📁 PATH     : $APK_FOUND"

      # ==========================================================
      # 11. ARTIFACT — compression 0 = upload lebih cepat
      # ==========================================================
      - name: "11 • Upload APK"
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      # ==========================================================
      # 12. FINAL SUMMARY
      # ==========================================================
      - name: "12 • Build summary"
        if: always()
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║                    BUILD SUMMARY                          ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo "Project : ${{ env.PROJECT_DIR }}"
          echo "Mode    : ${{ github.event.inputs.build_type }}"

          if [ -n "${APK_NAME:-}" ]; then
            echo "APK     : $APK_NAME"
          else
            echo "APK     : tidak tersedia"
          fi

          echo "Run     : $GITHUB_RUN_ID"
          echo
          echo "Log build lengkap tersedia sebagai:"
          echo "  build.log"
          echo "Log analyze lengkap tersedia sebagai:"
          echo "  analyze.log"
