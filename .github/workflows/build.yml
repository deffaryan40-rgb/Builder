name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true

      tag:
        description: "Tag build"
        required: true

      build_type:
        description: "debug / release"
        required: true
        default: "release"

      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

      shrink_code:
        description: "Aktifkan code shrinking R8 buat APK lebih kecil (true/false). Hanya aktifkan kalau project sudah punya proguard-rules yang benar, kalau tidak bisa runtime crash."
        required: false
        default: "false"

concurrency:
  group: build-flutter-apk-${{ github.event.inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # Percepat build Gradle: daemon off (single run), parallel + configuration
      # cache on, workers.max dipatok ke jumlah core runner (ubuntu-latest = 4 vCPU),
      # heap dinaikkan ke 4g supaya project besar (sampai ~2GB source) nggak OOM
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configuration-cache=true -Dorg.gradle.configureondemand=true -Dorg.gradle.workers.max=4 -Dorg.gradle.jvmargs=-Xmx4g"

    steps:

      # =========================
      # DOWNLOAD ZIP
      # =========================
      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="

          HTTP_CODE=$(curl -L --compressed \
            --retry 3 --retry-delay 5 --retry-connrefused \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "%{http_code}")

          SIZE=$(stat -c%s project.zip 2>/dev/null || echo 0)

          if [ "$HTTP_CODE" -ge 400 ] || [ "$SIZE" -eq 0 ]; then
            echo "❌ ERROR: Download ZIP gagal"
            echo "[BARIS ERROR] HTTP Status: $HTTP_CODE | Ukuran file: ${SIZE} bytes"
            echo "[PENYEBAB] URL tidak bisa diakses, salah, expired, atau butuh auth yang gagal (cek zip_url & secrets.GH_TOKEN)."
            exit 1
          fi

          echo "✅ Download OK — HTTP $HTTP_CODE, ukuran $(ls -lh project.zip | awk '{print $5}')"

      # =========================
      # EXTRACT ZIP
      # =========================
      - name: Extract ZIP
        run: |
          echo "=== Validating ZIP ==="

          if ! unzip -t project.zip > /dev/null 2>&1; then
            FTYPE=$(file -b project.zip)
            echo "❌ ERROR: File hasil download bukan ZIP yang valid"
            echo "[BARIS ERROR] Tipe file terdeteksi: $FTYPE"
            echo "[PENYEBAB] zip_url kemungkinan mengarah ke halaman HTML/error (bukan file ZIP langsung), atau file ZIP korup."
            exit 1
          fi

          echo "✅ ZIP valid"
          unzip -q project.zip -d project_raw

          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          if [ ! -f "$PROJECT_DIR/pubspec.yaml" ] && [ -z "$(find "$PROJECT_DIR" -maxdepth 2 -name gradlew 2>/dev/null)" ]; then
            echo "❌ ERROR: Bukan project Flutter/Android yang valid"
            echo "[BARIS ERROR] pubspec.yaml dan gradlew tidak ditemukan di: $PROJECT_DIR"
            echo "[PENYEBAB] ZIP yang diupload bukan root project Flutter/Android, atau struktur foldernya salah."
            exit 1
          fi

          echo "✅ Project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # =========================
      # JAVA
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # =========================
      # FLUTTER
      # (versi action di-pin ke rilis stabil, bukan @main,
      #  supaya tidak tiba-tiba berubah/rusak)
      # =========================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics --no-cli-animations

      # =========================
      # CACHE: Pub packages
      # =========================
      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('project_raw/**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # =========================
      # CACHE: Gradle
      # =========================
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('project_raw/**/*.gradle*', 'project_raw/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ==========================================================
      # 🔍 TAHAP ANALYZE — STEP 1: Jalankan & cetak hasil
      # (SKIP total kalau only_analyze=false, biar build normal
      #  langsung tancap ke tahap build tanpa buang waktu analyze)
      # ==========================================================
      - name: Analyze Project Code
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Starting Automated Code Analysis ==="

          if [ -f "pubspec.yaml" ]; then
            echo "🔍 Menjalankan linting via flutter analyze..."

            flutter analyze > analyze_report.txt 2>&1 || true

            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"

            rm -f analyze_report.txt

          else
            echo "☕ Project native / gradlew terdeteksi!"
            echo "[RESULT_ANALYZE]"
            echo "❌ Fitur analyze hanya support project Flutter (pubspec.yaml tidak ditemukan)."
            echo "[END_RESULT_ANALYZE]"
          fi

      # ==========================================================
      # 🔍 TAHAP ANALYZE — STEP 2: Stop workflow jika only_analyze
      # ==========================================================
      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "Analyze-only mode aktif. Workflow dihentikan di sini."
          exit 1

      # ==========================================================
      # 📦 TAHAP DOWNLOAD DEPENDENSI (PUB GET)
      # ==========================================================
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Running flutter pub get ==="
          if [ -f "pubspec.yaml" ]; then
            timeout 90s flutter pub get || echo "⚠️ Gagal download package karena network server, coba lanjut aja..."
          else
            echo "☕ Bukan project Flutter standar, skip pub get!"
          fi

      # ==========================================================
      # 🚀 TAHAP PEMBAKARAN UTAMA (BUILD APK)
      # Hanya target arm64-v8a -> paling cepat dikompilasi & APK
      # paling kecil (covers hampir semua HP modern 2018+).
      # --no-shrink tetap dipertahankan supaya tidak gagal karena
      # aturan R8/Proguard yang belum ada di project.
      # Kalau perlu dukung HP 32-bit lama, tambahkan
      # ",android-arm" di --target-platform (build jadi lebih lama).
      # ==========================================================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Building APK ==="
          echo "Mode: ${{ github.event.inputs.build_type }}"

          # Ambil baris error asli (file:line kalau ada) + tebak penyebabnya.
          # Singkat, tidak dump log mentah panjang-panjang.
          print_error_summary() {
            LOG="$1"
            echo "[BARIS ERROR]"
            grep -E -i \
              "error:|error :|\.dart:[0-9]+:[0-9]+|\.kt:.*error|\.java:.*error|FAILURE:|Exception:|Could not find|Unresolved reference|Duplicate class|SDK location not found" \
              "$LOG" | sort -u | head -n 15
            echo ""
            echo "[PENYEBAB]"
            FOUND=0
            grep -qi "Could not find"        "$LOG" && { echo "→ Dependency/package tidak ditemukan (cek nama & versi di pubspec.yaml / build.gradle)."; FOUND=1; }
            grep -qi "SDK location not found" "$LOG" && { echo "→ Android SDK path tidak terdeteksi di runner."; FOUND=1; }
            grep -qi "Unresolved reference"   "$LOG" && { echo "→ Ada kode yang mereferensikan sesuatu yang tidak ada / salah import."; FOUND=1; }
            grep -qi "Duplicate class"        "$LOG" && { echo "→ Ada dependency yang bentrok/duplikat class."; FOUND=1; }
            grep -qi "minSdkVersion"          "$LOG" && { echo "→ Kemungkinan konflik minSdkVersion antar plugin."; FOUND=1; }
            grep -qi "compileSdk"             "$LOG" && { echo "→ compileSdkVersion project kemungkinan kurang tinggi untuk salah satu plugin."; FOUND=1; }
            grep -qi "Execution failed for task" "$LOG" && { echo "→ $(grep -oE "Execution failed for task '[^']+'" "$LOG" | head -n1) gagal — lihat baris error di atas untuk detailnya."; FOUND=1; }
            if [ "$FOUND" -eq 0 ]; then
              echo "→ Lihat pesan pada [BARIS ERROR] di atas untuk detail spesifiknya."
            fi
          }

          BUILD_FAILED=0

          if [ -f "pubspec.yaml" ]; then
            echo "🔥 Project Flutter Terdeteksi! Kompilasi via Flutter SDK..."

            SHRINK_FLAG="--no-shrink"
            if [ "${{ github.event.inputs.shrink_code }}" = "true" ]; then
              echo "⚙️ Code shrinking (R8) diaktifkan -> APK lebih kecil."
              SHRINK_FLAG=""
            fi

            if ! flutter build apk --${{ github.event.inputs.build_type }} \
              --no-tree-shake-icons \
              --no-pub \
              --split-per-abi \
              --target-platform android-arm64 \
              $SHRINK_FLAG 2>&1 | tee build_report.txt; then
              BUILD_FAILED=1
            fi

          else
            echo "☕ Project Native Android Terdeteksi! Bypassing Flutter Core..."
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)

            if [ -z "$GRADLE_PATH" ]; then
              echo "❌ ERROR: File gradlew tidak ditemukan"
              echo "[RESULT_BUILD_ERROR]"
              echo "[BARIS ERROR] Tidak ada file 'gradlew' di dalam project."
              echo "[PENYEBAB] Project bukan struktur Android/Flutter yang valid, atau folder root ZIP salah."
              echo "[END_RESULT_BUILD_ERROR]"
              exit 1
            fi

            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew

            echo "🚀 Membakar APK menggunakan Gradle Native..."
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              GRADLE_TASK="assembleDebug"
            else
              GRADLE_TASK="assembleRelease"
            fi

            if ! ./gradlew "$GRADLE_TASK" --parallel --build-cache 2>&1 | tee build_report.txt; then
              BUILD_FAILED=1
            fi

            mv build_report.txt "$OLDPWD/build_report.txt" 2>/dev/null || true
            cd -
          fi

          if [ "$BUILD_FAILED" -eq 1 ]; then
            echo "❌ BUILD GAGAL"
            echo "[RESULT_BUILD_ERROR]"
            print_error_summary build_report.txt
            echo "[END_RESULT_BUILD_ERROR]"
            rm -f build_report.txt
            exit 1
          fi

          echo "✅ Build APK selesai tanpa error."
          rm -f build_report.txt

      # ==========================================================
      # CHECK APK (mendukung banyak APK hasil split-per-abi)
      # ==========================================================
      - name: Check APK Output
        run: |
          echo "=== APK Output Scanning (Fast Path Mode) ==="

          APK_DIR=""

          # Coba path standar Flutter dulu (instan, tidak scan seluruh workspace)
          if [ -d "${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk" ] && \
             [ -n "$(find "${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk" -maxdepth 1 -name '*.apk' 2>/dev/null)" ]; then
            APK_DIR="${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk"
          fi

          # Coba path standar Gradle native kalau belum ketemu
          if [ -z "$APK_DIR" ]; then
            GRADLE_APK=$(find "${{ env.PROJECT_DIR }}" -path "*/build/outputs/apk/*" -name "*.apk" 2>/dev/null | head -n 1)
            if [ -n "$GRADLE_APK" ]; then
              APK_DIR=$(dirname "$GRADLE_APK")
            fi
          fi

          # Fallback terakhir: scan seluruh workspace kalau dua di atas gagal
          if [ -z "$APK_DIR" ]; then
            echo "⚠️ Tidak ketemu di path standar, fallback scan seluruh workspace..."
            FALLBACK_APK=$(find "$GITHUB_WORKSPACE" -name "*.apk" 2>/dev/null | head -n 1)
            if [ -n "$FALLBACK_APK" ]; then
              APK_DIR=$(dirname "$FALLBACK_APK")
            fi
          fi

          if [ -z "$APK_DIR" ]; then
            echo "❌ ERROR: APK tidak ditemukan"
            echo "[BARIS ERROR] Tidak ada file *.apk di seluruh workspace ($GITHUB_WORKSPACE)."
            echo "[PENYEBAB] Build step melaporkan sukses tapi output APK tidak tersimpan di path default — kemungkinan flavor/productFlavor custom memindah output dir, atau task build yang jalan bukan assembleRelease/assembleDebug."
            exit 1
          fi

          echo "✅ APK Sukses Ditemukan di Folder: $APK_DIR"
          echo "APK_DIR=$APK_DIR" >> $GITHUB_ENV

          echo ""
          echo "=== Daftar APK & Ukuran ==="
          ls -lh "$APK_DIR"/*.apk

      # =========================
      # UPLOAD APK
      # =========================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_DIR }}/*.apk
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
