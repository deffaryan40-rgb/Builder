name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true

      tag:
        description: "Tag build"
        required: true

      build_type:
        description: "debug / release"
        required: true
        default: "release"

      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

concurrency:
  group: build-flutter-apk-${{ github.event.inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # Percepat build Gradle: daemon off (single run), parallel on, build cache on
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4 -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true -Dorg.gradle.jvmargs=-Xmx3g"

    steps:

      # =========================
      # DOWNLOAD ZIP
      # =========================
      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -L --compressed \
            --retry 3 --retry-delay 5 --retry-connrefused \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\n=== HTTP Status: %{http_code} ===\n=== Final URL: %{url_effective} ===\n"

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip

          echo ""
          echo "=== File Type ==="
          file project.zip

          echo ""
          echo "=== First Bytes ==="
          xxd project.zip | head -2

      # =========================
      # EXTRACT ZIP
      # =========================
      - name: Extract ZIP
        run: |
          echo "=== Validating ZIP ==="

          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            echo ""
            echo "=== Isi file ==="
            cat project.zip
            exit 1
          fi

          echo "✅ ZIP valid"

          echo ""
          echo "=== Extracting ZIP ==="
          unzip -q project.zip -d project_raw

          echo ""
          echo "=== Isi folder project_raw ==="
          find project_raw | head -50

          echo ""
          echo "=== Mengunci Project Dir (Manut Mode) ==="

          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          echo "✅ Project root langsung dikunci di: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # =========================
      # JAVA
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # =========================
      # FLUTTER
      # (versi action di-pin ke rilis stabil, bukan @main,
      #  supaya tidak tiba-tiba berubah/rusak)
      # =========================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      # ==========================================================
      # ⚡ CACHE GRADLE — hemat waktu download dependency Gradle
      # Cache di-key dari isi file *.gradle & gradle-wrapper.properties
      # milik project yang baru diextract, jadi tetap valid walau
      # nama folder project selalu berubah-ubah.
      # ==========================================================
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ==========================================================
      # ⚡ CACHE PUB — hemat waktu `flutter pub get`
      # ==========================================================
      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # ==========================================================
      # ⚡ CACHE INCREMENTAL BUILD — hemat waktu kalau tag yang sama
      # di-run ulang (misal abis fix kecil). Kalau tidak ada cache
      # lama, step ini simpel dilewati (tidak fatal).
      # ==========================================================
      - name: Cache Flutter incremental build
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJECT_DIR }}/.dart_tool
            ${{ env.PROJECT_DIR }}/build
          key: ${{ runner.os }}-flutterbuild-${{ github.event.inputs.tag }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutterbuild-${{ github.event.inputs.tag }}-

      # ==========================================================
      # 🔍 TAHAP ANALYZE — STEP 1: Jalankan & cetak hasil
      # (SKIP total kalau only_analyze=false, biar build normal
      #  langsung tancap ke tahap build tanpa buang waktu analyze)
      # ==========================================================
      - name: Analyze Project Code
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Starting Automated Code Analysis ==="

          if [ -f "pubspec.yaml" ]; then
            echo "🔍 Menjalankan linting via flutter analyze..."

            flutter analyze > analyze_report.txt 2>&1 || true

            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"

            rm -f analyze_report.txt

          else
            echo "☕ Project native / gradlew terdeteksi!"
            echo "[RESULT_ANALYZE]"
            echo "❌ Fitur analyze hanya support project Flutter (pubspec.yaml tidak ditemukan)."
            echo "[END_RESULT_ANALYZE]"
          fi

      # ==========================================================
      # 🔍 TAHAP ANALYZE — STEP 2: Stop workflow jika only_analyze
      # ==========================================================
      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "Analyze-only mode aktif. Workflow dihentikan di sini."
          exit 1

      # ==========================================================
      # 📦 TAHAP DOWNLOAD DEPENDENSI (PUB GET)
      # ==========================================================
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Running flutter pub get ==="
          if [ -f "pubspec.yaml" ]; then
            timeout 90s flutter pub get || echo "⚠️ Gagal download package karena network server, coba lanjut aja..."
          else
            echo "☕ Bukan project Flutter standar, skip pub get!"
          fi

      # ==========================================================
      # 📦 NYALAKAN R8/MINIFY & SHRINK RESOURCES — APK LEBIH KECIL
      # Hanya membalik nilai "false" -> "true" yang SUDAH ADA di
      # file build.gradle project. Kalau baris minify tidak ada
      # sama sekali di file, tidak disentuh (menghindari edit
      # struktur file yang bisa bikin gradle error).
      # Efek samping: APK jauh lebih kecil, upload jadi lebih
      # cepat karena file yang diupload lebih ringan.
      # ==========================================================
      - name: Size patch - enable R8 minify & shrink
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Mencari file build.gradle untuk diaktifkan minify-nya ==="
          GRADLE_FILES=$(grep -rlE "minifyEnabled|isMinifyEnabled" . --include="build.gradle*" 2>/dev/null || true)

          if [ -z "$GRADLE_FILES" ]; then
            echo "⚠️ Tidak ada baris minify di build.gradle, skip patch (project pakai default apa adanya)."
          else
            for f in $GRADLE_FILES; do
              echo "🚀 Patch: $f"
              sed -i \
                -e 's/minifyEnabled false/minifyEnabled true/g' \
                -e 's/isMinifyEnabled = false/isMinifyEnabled = true/g' \
                -e 's/shrinkResources false/shrinkResources true/g' \
                -e 's/isShrinkResources = false/isShrinkResources = true/g' \
                "$f" || echo "⚠️ Gagal patch $f, dilewati (tidak fatal, build tetap lanjut)."
            done
          fi

      # ==========================================================
      # 🚀 TAHAP PEMBAKARAN UTAMA (BUILD APK)
      # ==========================================================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Building APK ==="
          echo "Mode: ${{ github.event.inputs.build_type }}"

          BUILD_FAILED=0

          if [ -f "pubspec.yaml" ]; then
            echo "🔥 Project Flutter Terdeteksi! Kompilasi via Flutter SDK..."

            # --no-pub: pub get sudah dijalankan manual di step sebelumnya,
            # jadi build tidak perlu cek ulang dependency (hemat waktu).
            # --no-tree-shake-icons TETAP dipertahankan (bukan dihapus):
            # menghapusnya bisa memicu error build "Icon tree-shaking failed"
            # pada project yang generate IconData secara dinamis — risiko
            # error ini tidak sepadan dengan penghematan ukuran yang kecil.
            # Flag --no-shrink DIHAPUS supaya shrinkResources dari
            # build.gradle (sudah diaktifkan step sebelumnya) benar-benar
            # dieksekusi, ini yang bikin APK jauh lebih kecil.
            if ! flutter build apk --${{ github.event.inputs.build_type }} --no-tree-shake-icons --target-platform android-arm64 --no-pub 2>&1 | tee build_report.txt; then
              BUILD_FAILED=1
            fi

          else
            echo "☕ Project Native Android Terdeteksi! Bypassing Flutter Core..."
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)

            if [ -z "$GRADLE_PATH" ]; then
              echo "❌ ERROR: File 'gradlew' tidak ditemukan!"
              echo "[RESULT_BUILD_ERROR]"
              echo "Gagal menemukan file gradlew di dalam project. Pastikan ini project Android/Flutter yang valid."
              echo "[END_RESULT_BUILD_ERROR]"
              exit 1
            fi

            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew

            echo "🚀 Membakar APK menggunakan Gradle Native..."
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              GRADLE_TASK="assembleDebug"
            else
              GRADLE_TASK="assembleRelease"
            fi

            if ! ./gradlew "$GRADLE_TASK" --parallel --build-cache 2>&1 | tee build_report.txt; then
              BUILD_FAILED=1
            fi

            mv build_report.txt "$OLDPWD/build_report.txt" 2>/dev/null || true
            cd -
          fi

          if [ "$BUILD_FAILED" -eq 1 ]; then
            echo ""
            echo "❌ BUILD GAGAL! Berikut ringkasan error-nya:"
            echo ""
            echo "[RESULT_BUILD_ERROR]"
            if grep -Ei "error|exception|failure|failed" build_report.txt > /dev/null 2>&1; then
              grep -Ei -B2 -A5 "error|exception|failure|failed" build_report.txt
            else
              tail -n 80 build_report.txt
            fi
            echo "[END_RESULT_BUILD_ERROR]"
            echo ""
            echo "📄 Log build lengkap ada di file 'build_report.txt' (working directory project)."
            rm -f build_report.txt
            exit 1
          fi

          echo "✅ Build APK selesai tanpa error."
          rm -f build_report.txt

      # =========================
      # CHECK APK
      # =========================
      - name: Check APK Output
        run: |
          echo "=== APK Output Scanning (Fast Path Mode) ==="

          APK_FOUND=""

          # Coba path standar Flutter dulu (instan, tidak scan seluruh workspace)
          FLUTTER_APK=$(find "${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk" -maxdepth 1 -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$FLUTTER_APK" ]; then
            APK_FOUND="$FLUTTER_APK"
          fi

          # Coba path standar Gradle native kalau belum ketemu
          if [ -z "$APK_FOUND" ]; then
            GRADLE_APK=$(find "${{ env.PROJECT_DIR }}" -path "*/build/outputs/apk/*" -name "*.apk" 2>/dev/null | head -n 1)
            if [ -n "$GRADLE_APK" ]; then
              APK_FOUND="$GRADLE_APK"
            fi
          fi

          # Fallback terakhir: scan seluruh workspace kalau dua di atas gagal
          if [ -z "$APK_FOUND" ]; then
            echo "⚠️ Tidak ketemu di path standar, fallback scan seluruh workspace..."
            APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -z "$APK_FOUND" ]; then
            echo "Error: Berkas biner APK beneran gak dicetak sama sekali oleh compiler."
            exit 1
          fi

          APK_PATH=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")

          echo "✅ APK Sukses Ditemukan di Jalur: $APK_PATH"

          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

          echo ""
          echo "=== APK Size ==="
          ls -lh "$APK_FOUND"

      # =========================
      # UPLOAD APK
      # =========================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
