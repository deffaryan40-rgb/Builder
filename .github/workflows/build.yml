name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
        type: string
      tag:
        description: "Tag build"
        required: true
        type: string
      build_type:
        description: "debug / release"
        required: true
        default: "release"
        type: choice
        options: [debug, release]
      only_analyze:
        description: "Hanya analyze"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Validate workflow inputs
        run: |
          set -euo pipefail
          ZIP_URL="${{ github.event.inputs.zip_url }}"
          TAG="${{ github.event.inputs.tag }}"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$ZIP_URL" ]; then
            echo "::error::Input zip_url kosong. Build dihentikan agar tidak menghasilkan error palsu."
            exit 1
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Input tag kosong. Build dihentikan agar artifact memiliki nama yang valid."
            exit 1
          fi
          if [ "$BUILD_TYPE" != "debug" ] && [ "$BUILD_TYPE" != "release" ]; then
            echo "::error::build_type harus debug atau release."
            exit 1
          fi
          echo "INPUT OK: zip_url tersedia | tag=$TAG | build_type=$BUILD_TYPE"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Download ZIP project
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/octet-stream" -H "User-Agent: DEFFA-BUILD" "${{ github.event.inputs.zip_url }}" -o project.zip
          test -s project.zip
          unzip -t project.zip >/dev/null
          ls -lh project.zip

      - name: Extract ZIP
        run: |
          set -euo pipefail
          rm -rf project_raw
          mkdir -p project_raw
          unzip -q project.zip -d project_raw
          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/lib/main.dart"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Install required Android NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan."
            exit 1
          fi
          NDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/28.2.13676358"
          if [ -d "$NDK_DIR" ]; then
            echo "ANDROID NDK 28.2.13676358: CACHED"
          else
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "ndk;28.2.13676358"
            test -d "$NDK_DIR"
            echo "ANDROID NDK 28.2.13676358: INSTALLED"
          fi

      - name: Fast Android environment check
        run: |
          java -version
          flutter --version
          echo "FAST ENVIRONMENT: OK"

      - name: Prepare project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          rm -rf build
          echo "PROJECT READY"

      - name: Cache Flutter/Dart packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies (quiet)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          flutter pub get > pub_get_report.txt 2>&1
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo
            echo "BUILD FAILED"
            echo "Step: Dependencies"
            echo "============================"
            echo "Error utama:"
            grep -Ei "error|failed|exception|version solving failed|because .* depends on" pub_get_report.txt | head -n 12 || tail -n 20 pub_get_report.txt
            echo "============================"
            echo "Log lengkap: pub_get_report.txt"
            exit "$RC"
          fi
          echo "DEPENDENCIES: OK"

      - name: Fast build preflight
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "FAST PREFLIGHT: project structure OK (Flutter analyze dilewati agar build lebih cepat)"

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: exit 0

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          rm -f build_report.txt
          echo
          echo "BUILD APK"
          echo "Step: Build APK"
          echo "============================"
          echo "𝗪𝗘𝗕 𝗧𝗢 𝗔𝗣𝗞 𝗕𝗬 𝗭𝗜𝗣𝗘𝗥𝗥"

          # Selalu gunakan ABI split. Universal APK sering membengkak >50 MB
          # dan kemudian gagal saat dikirim lewat Telegram Bot API.
          # Release tetap dibuat per-ABI agar tiap file sekecil mungkin.
          # Gradle/Flutter speed flags. Cache tetap dipakai dan tidak mengubah source app.
          export GRADLE_OPTS="-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configuration-cache=true -Dorg.gradle.workers.max=4"
          export ORG_GRADLE_PROJECT_org.gradle.parallel=true
          BUILD_FLAGS="--${{ github.event.inputs.build_type }} --no-pub"
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            BUILD_FLAGS="$BUILD_FLAGS --split-per-abi"
          fi
          if ! flutter build apk $BUILD_FLAGS > build_report.txt 2>&1; then
            echo
            echo "BUILD FAILED"
            echo "============================"
            echo "Error utama / lokasi:"

            # Compiler Dart: tampilkan hanya file:baris:kolom + pesan inti.
            grep -E "^lib/[^:]+:[0-9]+:[0-9]+: (Error|error):" build_report.txt | head -n 8 || true

            # Error Dart alternatif dari output analyzer/compiler.
            grep -E "^error •" build_report.txt | head -n 5 || true

            echo
            echo "Build/Gradle:"
            grep -E "Execution failed for task|Gradle task .* failed|Target kernel_snapshot_program failed|BUILD FAILED" build_report.txt | tail -n 5 || true
            echo "============================"
            echo "Log lengkap disimpan di: build_report.txt"
            exit 1
          fi

          APK_COUNT=$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | wc -l)
          if [ "$APK_COUNT" -lt 1 ]; then
            echo
            echo "BUILD FAILED"
            echo "APK tidak ditemukan setelah Flutter build."
            exit 1
          fi

          echo
          echo "BUILD OK"
          echo "APK COUNT: $APK_COUNT"
          find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print -exec du -h {} \;

          # Guardrail: jangan pernah meneruskan APK universal besar ke jalur
          # pengiriman Bot API. Jika ada APK >49 MiB, build tetap sukses tetapi
          # tandai dengan jelas; handler akan memakai MTProto filePath fallback.
          while IFS= read -r apk; do
            SIZE_BYTES=$(stat -c%s "$apk")
            SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
            if [ "$SIZE_BYTES" -gt $((49 * 1024 * 1024)) ]; then
              echo "::warning::APK besar terdeteksi: $(basename "$apk") (${SIZE_MB} MiB). Telegram Bot API tidak akan dipakai; gunakan jalur MTProto."
            fi
          done < <(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print)

      - name: Prepare APK artifact
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          rm -rf build/deffa-artifact
          mkdir -p build/deffa-artifact
          find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -exec cp {} build/deffa-artifact/ \;
          test "$(find build/deffa-artifact -maxdepth 1 -type f -name '*.apk' | wc -l)" -ge 1

      - name: Upload APK directly to Release (RETRY + VERIFY)
        id: release_upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find build/deffa-artifact -maxdepth 1 -type f -name '*.apk' -print | sort)
          test "${#APKS[@]}" -ge 1
          echo "⚡ RELEASE UPLOAD: ${#APKS[@]} APK ABI"

          # Release dibuat oleh bot sebelum workflow dijalankan. Tunggu sebentar
          # bila GitHub belum mempublikasikan release asset endpoint-nya.
          READY=0
          for n in $(seq 1 12); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::GitHub Release $TAG tidak tersedia setelah menunggu 24 detik."
            exit 1
          fi

          # Upload satu per satu + retry. Ini lebih stabil daripada satu request
          # besar berisi beberapa asset sekaligus dan mencegah workflow diam-diam
          # jatuh ke artifact ZIP.
          for apk in "${APKS[@]}"; do
            ok=0
            for attempt in 1 2 3 4 5; do
              echo "📤 $(basename "$apk") — upload ${attempt}/5"
              if gh release upload "$TAG" "$apk" --repo "$GITHUB_REPOSITORY" --clobber; then
                ok=1
                break
              fi
              sleep $((attempt * 2))
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Gagal upload $(basename "$apk") ke GitHub Release setelah 5 percobaan."
              exit 1
            fi
          done

          # Verifikasi asset benar-benar sudah terlihat sebelum Actions dianggap sukses.
          ASSET_COUNT=0
          for n in $(seq 1 15); do
            ASSET_COUNT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[] | select(.name | endswith(".apk"))] | length' 2>/dev/null || echo 0)
            if [ "$ASSET_COUNT" -ge "${#APKS[@]}" ]; then break; fi
            sleep 2
          done
          if [ "$ASSET_COUNT" -lt "${#APKS[@]}" ]; then
            echo "::error::Release upload belum lengkap. Expected=${#APKS[@]}, actual=$ASSET_COUNT"
            exit 1
          fi
          echo "DIRECT RELEASE APKs: VERIFIED ($ASSET_COUNT files)"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Sengaja tidak memakai upload-artifact untuk APK. Artifact ZIP adalah
      # fallback yang lambat dan menyebabkan UI menampilkan 'Artifact x/y MB'.
      # Jika Release gagal, workflow harus gagal dengan diagnostic yang jelas
      # agar bot tidak mengunduh ZIP artifact yang besar.
