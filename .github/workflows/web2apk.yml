name: Web2APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        required: true
        type: string
      app_name:
        required: true
        type: string
      icon_url:
        required: true
        type: string
      package_name:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create Android WebView project
        shell: bash
        env:
          WEB_URL: ${{ inputs.web_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          ICON_URL: ${{ inputs.icon_url }}
        run: |
          set -e
          PKG_PATH="${PACKAGE_NAME//./\/}"
          mkdir -p "web2apk/app/src/main/java/$PKG_PATH" web2apk/app/src/main/res/drawable web2apk/app/src/main/res/values
          curl -L --fail --max-time 60 "$ICON_URL" -o web2apk/app/src/main/res/drawable/app_icon.png
          cat > web2apk/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='web2apk'
          include ':app'
          EOF
          cat > web2apk/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > web2apk/app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
            namespace '${PACKAGE_NAME}'
            compileSdk 35
            defaultConfig {
              applicationId '${PACKAGE_NAME}'
              minSdk 23
              targetSdk 35
              versionCode 1
              versionName '1.0'
            }
          }
          EOF
          cat > web2apk/app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="${PACKAGE_NAME}">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:theme="@style/AppTheme" android:label="${APP_NAME}" android:icon="@drawable/app_icon">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > web2apk/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#000000</item>
              <item name="android:navigationBarColor">#000000</item>
            </style>
          </resources>
          EOF
          cat > "web2apk/app/src/main/java/$PKG_PATH/MainActivity.java" <<EOF
          package ${PACKAGE_NAME};
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              WebView w = new WebView(this);
              w.getSettings().setJavaScriptEnabled(true);
              w.getSettings().setDomStorageEnabled(true);
              w.getSettings().setMediaPlaybackRequiresUserGesture(false);
              w.setWebViewClient(new WebViewClient());
              w.loadUrl("${WEB_URL}");
              setContentView(w);
            }
          }
          EOF
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build APK
        run: |
          cd web2apk
          gradle --no-daemon :app:assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-apk
          path: web2apk/app/build/outputs/apk/release/app-release.apk
